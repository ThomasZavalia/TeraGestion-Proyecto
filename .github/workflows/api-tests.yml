name: API & Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Crear archivo .env para Docker Compose
        run: |
          cat > .env << 'EOF'
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=TeraAPI
          JWT_AUDIENCE=TeraAPIUsers
          FRONTEND_BASE_URL=http://localhost:5173
          SMTP_SERVER=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SENDER_NAME=TeraGestion Notificaciones
          SMTP_SENDER_EMAIL=${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_ENABLE_SSL=true
          RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
          RECAPTCHA_MIN_SCORE=0.5
          EOF

      - name: Levantar servicios (DB y Backend) con Docker Compose
        run: docker compose up -d --build db backend

      - name: Esperar que el backend esté listo
        run: |
          echo "Esperando que la API responda en localhost:5000..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/api/Auth/login > /dev/null 2>&1; then
              echo "Backend listo!"
              break
            fi
            echo "Intento $i/30 - esperando..."
            sleep 2
          done

      - name: Restaurar dependencias
        run: dotnet restore backend/TeraGestion.sln
        working-directory: ${{ github.workspace }}

      - name: Compilar solución
        run: dotnet build backend/TeraGestion.sln --no-restore --configuration Release

      - name: Ejecutar tests de API e integración
        run: dotnet test backend/TeraGestion.Tests/TeraGestion.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Apagar servicios Docker
        if: always()
        run: docker compose down
