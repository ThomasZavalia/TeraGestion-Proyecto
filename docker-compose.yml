services:
  db:
    image: postgres:15-alpine
    container_name: teragestion_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5435:5432"
    volumes:  
      - postgres_data:/var/lib/postgresql/data
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5  
     

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teragestion_api
    restart: on-failure
    depends_on:
     db:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - FrontendBaseUrl=${FRONTEND_BASE_URL}
      - SmtpSettings__Server=${SMTP_SERVER}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__SenderName=${SMTP_SENDER_NAME}
      - SmtpSettings__SenderEmail=${SMTP_SENDER_EMAIL}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL}
      - Recaptcha__SecretKey=${RECAPTCHA_SECRET_KEY}
      - Recaptcha__MinScore=${RECAPTCHA_MIN_SCORE}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teragestion_web
    restart: on-failure
    ports:
      - "5173:80"
    depends_on:
      - backend


volumes:
  postgres_data: